name: Update live prices

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-prices.mjs
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      - id: changed
        run: |
          git config user.name "price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update live prices"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # a push made with the workflow's own token doesn't trigger the
      # separate Pages-deploy workflow (GitHub blocks that cascade to avoid
      # infinite loops), so this job redeploys Pages itself whenever it just
      # committed a fresh prices.json.
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - if: steps.changed.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.changed.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
